<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>即阅 HTML Sample</title>
  <style>
    :root {
      color-scheme: light;
      --text: #071326;
      --muted: #50627e;
      --line: #e7edf5;
      --panel: #f8fafc;
      --accent: #0f766e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px 16px 28px;
      color: var(--text);
      background: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      line-height: 1.55;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 18px;
      line-height: 1.25;
      font-weight: 800;
      letter-spacing: 0;
    }
    p {
      margin: 0 0 14px;
    }
    .note {
      margin: 6px 0 18px;
      padding: 13px 14px;
      color: var(--muted);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 7px;
    }
    .external-link {
      display: inline-flex;
      align-items: center;
      min-height: 33px;
      padding: 0 13px;
      color: #123047;
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: 7px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08);
    }
    .footnote {
      margin-top: 12px;
      color: #6f82a7;
      font-size: 10px;
    }
  </style>
  <script>
    window.androidInstantReadScriptProbe = "script-ran";
  </script>
</head>
<body>
  <h1>HTML Sample Page</h1>
  <p>This is a test page for local HTML preview. All scripting is disabled for security.</p>
  <p class="note">Example of how elements are rendered in the safe preview container.</p>
  <a class="external-link" href="https://example.com/">打开外部链接</a>
  <p class="footnote">* 本预览环境已通过 Security Sandbox 进行隔离。</p>
</body>
</html>
