<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>单 HTML 缺少兄弟资源样例</title>
  <link rel="stylesheet" href="assets/missing-style.css">
</head>
<body>
  <h1>单 HTML 缺少兄弟资源</h1>
  <p>这份 HTML 引用了没有一起导入的本地图片和样式表。</p>
  <p>即阅只复制 HTML 自身副本，因此图片与样式会缺失；预览页应提示打包为 ZIP 后重新导入。</p>
  <img src="assets/missing-image.png" alt="缺失的本地图片">
</body>
</html>
